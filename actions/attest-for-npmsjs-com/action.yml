name: "[Ledger Security] Attest an npm package for npmjs.com distribution"
description: "Attest one or many npm packages for npmjs.com distribution. Supports a single pre-packed tarball, a directory of tarballs (all attested), or a directory with a package.json to pack."
inputs:
  subject-path:
    description: 'Path to the npm package(s) to attest. Can be a .tgz file, a directory containing one or more .tgz files (all of them are attested), or a directory with a package.json to pack when no .tgz files are present.'
    required: true
  package-manager:
    description: 'Package manager to use for packing when subject-path is a directory with package.json and no .tgz files are present (npm or pnpm). Defaults to npm.'
    required: false
    default: 'npm'

outputs:
  tarball-path:
    description: 'Absolute path to the first (or only) tarball that was attested. When a directory of tarballs is attested, every tarball is attested but this returns the first one for backward compatibility.'
    value: ${{ steps.package-details.outputs.TARBALL_PATH }}

runs:
  using: "composite"
  steps:
      - name: Check if repository is public (signature are leaking private information)
        if: ${{ github.event.repository.visibility != 'public' }}
        shell: bash
        run: |
          echo "::error::This action only runs on public repositories. To avoid leaking private information, the action will be stopped."
          exit 1
      # TODO: This restriction can be dropped once npmjs.com accepts attestations from self-hosted runners.
      - name: Check if running on a GitHub-hosted runner
        if: ${{ runner.environment != 'github-hosted' }}
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          echo "::error::This action must run on a GitHub-hosted runner. npmjs.com provenance verification rejects attestations generated on self-hosted runners (Runner Environment: \"$RUNNER_ENVIRONMENT\")."
          exit 1
      - name: Set GitHub Path
        run: echo "$GITHUB_ACTION_PATH" >> "$GITHUB_PATH"
        shell: bash
        env:
          GITHUB_ACTION_PATH: ${{ github.action_path }}
      - name: Auto-Detect - Package details
        id: package-details
        shell: bash
        env:
          SUBJECT_PATH: ${{ inputs.subject-path }}
          PACK_MANAGER: ${{ inputs.package-manager }}
        run: |
          set -euo pipefail

          if [ "$PACK_MANAGER" != "npm" ] && [ "$PACK_MANAGER" != "pnpm" ]; then
            echo "::error::Unsupported package manager: $PACK_MANAGER. Use 'npm' or 'pnpm'."
            exit 1
          fi

          if [ ! -e "$SUBJECT_PATH" ]; then
            echo "::error::Provided subject-path does not exist: $SUBJECT_PATH"
            exit 1
          fi

          # Resolve subject-path to absolute for consistent behavior
          SUBJECT_ABS=$(realpath "$SUBJECT_PATH")

          # List of tarballs to attest (populated below).
          declare -a TARBALLS=()

          collect_tgz() {
            local search_dir="$1"
            shopt -s nullglob
            TARBALLS=("$search_dir"/*.tgz)
            shopt -u nullglob
          }

          # Resolve the tarball(s) based on what was provided.
          # For directory inputs, existing .tgz files take precedence over packing from package.json.
          if [ -f "$SUBJECT_ABS" ] && [[ "$SUBJECT_ABS" == *.tgz ]]; then
            echo "Using existing tarball: $SUBJECT_ABS"
            TARBALLS=("$SUBJECT_ABS")

          elif [ -d "$SUBJECT_ABS" ]; then
            collect_tgz "$SUBJECT_ABS"

            if [ "${#TARBALLS[@]}" -gt 0 ]; then
              if [ -f "$SUBJECT_ABS/package.json" ]; then
                echo "::warning::Both .tgz files and package.json were found in $SUBJECT_ABS. Using existing .tgz tarball(s)."
              fi
              echo "Found ${#TARBALLS[@]} tarball(s) in directory: $SUBJECT_ABS"

            elif [ -f "$SUBJECT_ABS/package.json" ]; then
              echo "Found package.json in $SUBJECT_ABS, packing with $PACK_MANAGER..."
              if ! (cd "$SUBJECT_ABS" && "$PACK_MANAGER" pack); then
                echo "::error::$PACK_MANAGER pack failed in $SUBJECT_ABS"
                exit 1
              fi
              collect_tgz "$SUBJECT_ABS"
              if [ "${#TARBALLS[@]}" -eq 0 ]; then
                echo "::error::$PACK_MANAGER pack succeeded but no .tgz file was found in $SUBJECT_ABS"
                exit 1
              fi
              echo "::warning::When packing from a directory, ensure you publish the exact same tarball(s) that were attested."

            else
              echo "::error::No .tgz file or package.json found at: $SUBJECT_PATH"
              exit 1
            fi

          else
            echo "::error::subject-path must point to a .tgz file, a directory containing .tgz files, or a directory with package.json: $SUBJECT_PATH"
            exit 1
          fi

          EXPECTED_REPO_URL="https://github.com/${GITHUB_REPOSITORY}"

          # Build the packages list consumed by the SLSA layout script: one entry
          # per tarball with the metadata needed to build its in-toto subject.
          PACKAGES_LIST_FILE="$(pwd)/packages_list.json"
          echo "[]" > "$PACKAGES_LIST_FILE"
          FIRST_TARBALL=""

          for TARBALL in "${TARBALLS[@]}"; do
            TARBALL_ABS=$(realpath "$TARBALL")
            if [ -z "$FIRST_TARBALL" ]; then
              FIRST_TARBALL="$TARBALL_ABS"
            fi

            # Extract metadata directly from the tarball without re-packing
            if ! PACKAGE_JSON=$(tar xzf "$TARBALL_ABS" -O package/package.json 2>/dev/null); then
              echo "::error::Failed to extract package/package.json from tarball: $TARBALL_ABS"
              exit 1
            fi
            if [ -z "$PACKAGE_JSON" ]; then
              echo "::error::package/package.json was not found or is empty in tarball: $TARBALL_ABS"
              exit 1
            fi

            if ! PACKAGE_NAME=$(jq -er '.name' <<<"$PACKAGE_JSON"); then
              echo "::error::Failed to parse package name from package/package.json in tarball: $TARBALL_ABS"
              exit 1
            fi
            if ! PACKAGE_VERSION=$(jq -er '.version' <<<"$PACKAGE_JSON"); then
              echo "::error::Failed to parse package version from package/package.json in tarball: $TARBALL_ABS"
              exit 1
            fi

            # npmjs.com provenance verification requires repository.url to match the
            # building repository, otherwise publish fails with an E422.
            REPO_URL=$(jq -r '.repository.url // ""' <<<"$PACKAGE_JSON")
            if [ -z "$REPO_URL" ]; then
              echo "::error::package.json for \"${PACKAGE_NAME}\" is missing \"repository.url\". npmjs.com provenance verification requires it to match \"${EXPECTED_REPO_URL}\". Add to your package.json: \"repository\": { \"type\": \"git\", \"url\": \"${EXPECTED_REPO_URL}\" }"
              exit 1
            fi

            NORMALIZED_REPO_URL=$(echo "$REPO_URL" | sed -E 's|^git\+||; s|\.git$||')
            if [ "$NORMALIZED_REPO_URL" != "$EXPECTED_REPO_URL" ]; then
              echo "::error::package.json \"repository.url\" for \"${PACKAGE_NAME}\" is \"${REPO_URL}\" (normalized: \"${NORMALIZED_REPO_URL}\"), expected \"${EXPECTED_REPO_URL}\". This mismatch will cause an E422 from npmjs.com."
              exit 1
            fi

            PACKAGE_FILENAME=$(basename "$TARBALL_ABS")
            if ! PACKAGE_SHA512=$(openssl dgst -sha512 -binary "$TARBALL_ABS" | base64 | tr -d '\n'); then
              echo "::error::Failed to compute sha512 for tarball: $TARBALL_ABS"
              exit 1
            fi
            if [ -z "$PACKAGE_SHA512" ]; then
              echo "::error::Computed empty sha512 for tarball: $TARBALL_ABS"
              exit 1
            fi
            PACKAGE_INTEGRITY="sha512-${PACKAGE_SHA512}"

            echo "Validated \"$PACKAGE_NAME\"@\"$PACKAGE_VERSION\" ($PACKAGE_FILENAME): repository.url matches expected provenance source."

            TMP_LIST=$(mktemp)
            jq -c \
              --arg name "$PACKAGE_NAME" \
              --arg version "$PACKAGE_VERSION" \
              --arg integrity "$PACKAGE_INTEGRITY" \
              --arg filename "$PACKAGE_FILENAME" \
              '. + [{name: $name, version: $version, integrity: $integrity, filename: $filename}]' \
              "$PACKAGES_LIST_FILE" > "$TMP_LIST"
            mv "$TMP_LIST" "$PACKAGES_LIST_FILE"
          done

          PACKAGE_COUNT=$(jq 'length' "$PACKAGES_LIST_FILE")
          if [ "$PACKAGE_COUNT" -eq 0 ]; then
            echo "::error::No tarballs were resolved for attestation from: $SUBJECT_PATH"
            exit 1
          fi
          echo "Resolved ${PACKAGE_COUNT} package(s) to attest."

          EOF_MARKER=$(openssl rand -hex 16 2>/dev/null || python3 -c 'import uuid; print(uuid.uuid4().hex)' 2>/dev/null || echo "EOF_$(date +%s%N)_$$")
          if [ -z "$EOF_MARKER" ]; then
            echo "::error::Failed to generate a safe delimiter for GITHUB_OUTPUT."
            exit 1
          fi

          {
            echo "PACKAGES_LIST_FILE=${PACKAGES_LIST_FILE}"
            echo "TARBALL_PATH<<${EOF_MARKER}"
            echo "$FIRST_TARBALL"
            echo "${EOF_MARKER}"
          } >> "$GITHUB_OUTPUT"
      - name: Print all outputs of package details
        shell: bash
        run: |
          echo "PACKAGES_LIST_FILE=${{ steps.package-details.outputs.PACKAGES_LIST_FILE }}"
          echo "TARBALL_PATH=${{ steps.package-details.outputs.TARBALL_PATH }}"
      - name: Generate the Predicate
        shell: bash
        env:
          BUILDER_ID: ${{ github.workflow_ref }} # Build is made on the same job
          CONFIG_SOURCE_URI: git+${{ github.event.repository.html_url }}@${{ github.ref }}
          CONFIG_SOURCE_DIGEST: ${{ github.sha }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_TRIGGERING_ACTOR_ID: ${{ github.triggering_actor }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          BUILD_INVOCATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: slsa-github-generator-nodejs-predicate.sh
      - name: Generate the SLSA layout
        shell: bash
        env:
          SLSA_OUTPUTS_ARTIFACTS_FILE: artifacts-layout.json
          PACKAGES_LIST_FILE: ${{ steps.package-details.outputs.PACKAGES_LIST_FILE }}
        run: slsa-github-generator-nodejs-layout.sh
      - name: Build the in-toto statements from the SLSA layout
        # This step replaces slsa-framework/.../generate-attestations, which caps a
        # single layout at 50 attestations (MAX_ATTESTATION_COUNT) and therefore
        # cannot serve large monorepos. It produces the exact same single-subject
        # in-toto statements from the layout + predicate, with no such cap.
        shell: bash
        env:
          SLSA_LAYOUT_FILE: artifacts-layout.json
          PREDICATE_FILE: predicate.json
          PREDICATE_TYPE: https://slsa.dev/provenance/v0.2
          OUTPUT_FOLDER: attestations
        run: build-intoto-statements.sh
      - name: Sign the attestations
        uses: slsa-framework/slsa-github-generator/.github/actions/sign-attestations@v2.0.0
        with:
          payload-type: application/vnd.in-toto+json
          attestations: attestations
          output-folder: attestations-signed
      - name: Upload the signed attestations to the GitHub API
        uses: actions/github-script@v6
        env:
          ATTESTATIONS_DIR: attestations-signed
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const attestationsDir = process.env.ATTESTATIONS_DIR;
            const [owner, repoName] = process.env.GITHUB_REPOSITORY.split('/');

            const files = fs
              .readdirSync(attestationsDir)
              .filter((f) => f.endsWith('.build.slsa'))
              .sort();

            if (files.length === 0) {
              throw new Error(`No signed attestation files found in ./${attestationsDir}.`);
            }

            let uploaded = 0;
            for (const file of files) {
              const attestationPath = path.join(attestationsDir, file);
              const attestation = JSON.parse(fs.readFileSync(attestationPath, 'utf8'));

              const response = await github.request('POST /repos/{owner}/{repo}/attestations', {
                owner: owner,
                repo: repoName,
                headers: {
                  'X-GitHub-Api-Version': '2022-11-28'
                },
                data: {
                  bundle: attestation
                }
              });

              if (response.status !== 201) {
                throw new Error(`Failed to upload attestation ${file} to GitHub API. HTTP status code: ${response.status}`);
              }

              uploaded += 1;
              console.log(`Uploaded attestation ${file} (id: ${response.data && response.data.id}).`);
            }

            console.log(`Uploaded ${uploaded} attestation(s) successfully.`);
