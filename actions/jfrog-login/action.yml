name: "[Ledger Security] JFrog Login"
author: LedgerHQ
description: |
  The `jfrog-login` GitHub Action facilitates a secure login to Ledger's JFrog platform, which includes services such as **Artifactory** and **Xray**. By using OIDC authentication, this action ensures secure access to manage artifacts, perform security scans, and interact with the JFrog APIs and CLI without handling sensitive credentials manually.

  This action is designed for seamless integration within Ledger's CI/CD pipeline, allowing developers to securely interact with JFrog services while automating critical parts of the software supply chain.

inputs:
  jfrog-url:
    description: "Base URL of the JFrog platform to be used for API/CLI operations. Defaults to Ledger's JFrog URL if not specified."
    required: false
    default: "https://jfrog.ledgerlabs.net"
  package-alias-tools:
    description: "Comma-separated list of package managers to alias (e.g. npm,pnpm,pip,go,mvn). Resolve repos are auto-configured for each."
    required: false
    default: "npm,pnpm"

outputs:
  oidc-token:
    description: "OIDC token generated by JFrog CLI for secure API/CLI interactions, using the Setup JFrog CLI step with the configured oidc-provider-name."
    value: ${{ steps.setup-jfrog-cli.outputs.oidc-token }}
  oidc-user:
    description: "Username extracted from the OIDC token during authentication."
    value: ${{ steps.setup-jfrog-cli.outputs.oidc-user }}
  jfrog-url:
    description: "Base URL of Ledger's JFrog platform to be used for subsequent API/CLI operations."
    value: ${{ inputs.jfrog-url }}
  jfrog-domain:
    description: "Base domain of Ledger's JFrog platform to be used for subsequent API/CLI operations."
    value: ${{ steps.expose-outputs.outputs.jfrog-domain }}

runs:
  using: "composite"
  steps:
  - name: Check if JFrog URL is accessible
    run: |
      http_code=$(curl -s -o /dev/null -w "%{http_code}" "${{ inputs.jfrog-url }}")
      if [ "$http_code" -eq 403 ]; then
        echo "::error title=JFrog instance is not accessible::The JFrog instance is behind a whitelist. Please ensure you use a whitelisted GitHub Runner (Ledger internal runner)"
        exit 1
      elif [ "$http_code" -ne 200 ]; then
        echo "::error title=JFrog instance is not accessible::JFrog URL '${{ inputs.jfrog-url }}' returned status code ${http_code}"
        exit 1
      fi
    shell: bash
  - uses: jfrog/setup-jfrog-cli@v5
    id: setup-jfrog-cli
    env:
      JF_URL: ${{ inputs.jfrog-url }}
      JFROG_CLI_GHOST_FROG: "true"
    with:
      version: latest
      oidc-provider-name: github-oidc
      oidc-audience: jfrog-github
      enable-package-alias: true
      package-alias-tools: ${{ inputs.package-alias-tools }}
  - name: Configure resolve repos for package aliases
    run: |
      TOOLS="${{ inputs.package-alias-tools }}"
      SERVER_ID="setup-jfrog-cli-server"
      NPM_CONFIGURED=false
      for tool in $(echo "$TOOLS" | tr ',' ' '); do
        case "$tool" in
          npm|pnpm)
            if [ "$NPM_CONFIGURED" = "false" ]; then
              jf npm-config --repo-resolve=ossproxy-npm-proxy-npmjs --server-id-resolve="$SERVER_ID"
              NPM_CONFIGURED=true
            fi
            ;;
          pip|pipenv|poetry)
            jf pip-config --repo-resolve=ossproxy-pypi-proxy-pypiorg --server-id-resolve="$SERVER_ID"
            ;;
          go)
            jf go-config --repo-resolve=ossproxy-go-proxy-golang --server-id-resolve="$SERVER_ID"
            ;;
          mvn)
            jf mvn-config --repo-resolve-releases=ossproxy-maven-proxy-mavencentral --repo-resolve-snapshots=ossproxy-maven-proxy-mavencentral --server-id-resolve="$SERVER_ID"
            ;;
        esac
      done
    shell: bash
  - name: Expose outputs as environment variables
    id: expose-outputs
    run: |
      : Expose outputs as environment variables
      JFROG_DOMAIN=$(echo "${{ inputs.jfrog-url }}" | awk -F[/:] '{print $4}')
      echo "JFROG_DOMAIN=$JFROG_DOMAIN" >> $GITHUB_ENV
      echo "jfrog-domain=$JFROG_DOMAIN" >> $GITHUB_OUTPUT
      echo "JFROG_USER=${{ steps.setup-jfrog-cli.outputs.oidc-user }}" >> $GITHUB_ENV
      echo "JFROG_TOKEN=${{ steps.setup-jfrog-cli.outputs.oidc-token }}" >> $GITHUB_ENV
      echo "JFROG_URL=${{ inputs.jfrog-url }}" >> $GITHUB_ENV
      echo "JFROG_CLI_GHOST_FROG=true" >> $GITHUB_ENV
      echo "JFROG_CLI_BUILD_NAME=$GITHUB_REPOSITORY" >> $GITHUB_ENV
      echo "JFROG_CLI_BUILD_URL=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> $GITHUB_ENV
    shell: bash
